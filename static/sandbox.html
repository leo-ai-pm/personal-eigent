<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>网页安全通道 · Personal Eigent个人助手</title>
  <meta name="theme-color" content="#F3F7F8" />
  <link rel="icon" href="/static/brand-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/design.css?v=__APP_VERSION__" />
  <style>
    body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; min-height: 100dvh; padding: 64px 20px; background: var(--bg); color: var(--text); font: 14px/1.65 var(--font-sans); -webkit-font-smoothing: antialiased; }
    .panel { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; box-shadow: 0 12px 36px rgba(25, 52, 60, 0.04); }
    .page-brand { display: flex; align-items: center; gap: 11px; width: fit-content; max-width: 100%; margin-bottom: 32px; color: var(--text); text-decoration: none; border-radius: 10px; }
    .page-brand img { display: block; flex: 0 0 auto; }
    .page-brand-name { font-size: 16px; line-height: 1.3; font-weight: 600; letter-spacing: -0.025em; }
    .page-brand-name span { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 12px; font-weight: 400; letter-spacing: 0.06em; }
    h1 { font-size: 22px; line-height: 1.4; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
    p { color: var(--text-secondary); line-height: 1.7; margin: 0 0 16px; overflow-wrap: anywhere; }
    .btn { min-height: 44px; margin-top: 20px; }
    .msg { margin-top: 20px; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
    .msg:empty { margin: 0; }
    .msg.err { color: var(--error-text); }
    .msg.ok { color: var(--success-text); }
    .note { font-size: 12px; color: var(--text-tertiary); margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--border); }
    .page-brand:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; }
    button, a { touch-action: manipulation; -webkit-tap-highlight-color: var(--accent-soft); }
    .panel { max-width: 640px; }
    h2 { font-size: 15px; line-height: 1.5; font-weight: 600; margin: 24px 0 10px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 18px 0 7px; }
    .field-input { width: 100%; min-height: 44px; box-sizing: border-box; }
    textarea.field-input { min-height: 140px; resize: vertical; font: inherit; }
    .draft-kind { display: inline-block; padding: 4px 11px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--border); font-size: 12px; color: var(--accent); margin-bottom: 12px; }
    .draft-title { font-size: 17px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
    .draft-body { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 18px; line-height: 1.8; font-family: inherit; font-size: 14px; }
    .draft-notes { margin: 16px 0 0; padding-left: 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
    .decision { margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
    #draft > p:last-child { margin-top: 20px; }
    @media (max-width: 600px) {
      body { padding: 24px 14px; }
      .panel { padding: 26px 22px; }
      .page-brand { margin-bottom: 28px; }
      h1 { font-size: 20px; }
      .field-input { font-size: 16px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <a class="page-brand" href="/" aria-label="Personal Eigent个人助手，返回对话">
      <img src="/static/brand-mark.svg" width="36" height="36" alt="" />
      <span class="page-brand-name">Personal Eigent<span>个人助手</span></span>
    </a>
    <h1>网页安全通道</h1>
    <p id="intro">正在检查链接…</p>

    <form id="form" hidden>
      <label for="name">姓名（可选）</label>
      <input class="field-input" id="name" autocomplete="name" />
      <label for="city">城市（可选）</label>
      <input class="field-input" id="city" autocomplete="address-level2" />
      <label for="phone">手机号（可选）</label>
      <input class="field-input" id="phone" inputmode="tel" autocomplete="tel" />
      <label for="email">邮箱（可选）</label>
      <input class="field-input" id="email" type="email" autocomplete="email" />
      <label for="facts">备注（可选，一行一条）</label>
      <textarea class="field-input" id="facts" placeholder="比如：下周三出差&#10;家里有一只猫"></textarea>
      <button class="btn btn-primary" type="submit" id="submit">安全提交</button>
    </form>

    <section id="draft" hidden>
      <span class="draft-kind" id="draftKind"></span>
      <h2 class="draft-title" id="draftTitle" hidden></h2>
      <div class="draft-body" id="draftBody"></div>
      <ul class="draft-notes" id="draftNotes" hidden></ul>
      <p class="decision" id="draftDecision" hidden></p>
      <p>看完后回到聊天窗口点「确认」或「拒绝」。</p>
    </section>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <p class="note">这里填写的内容只保存在服务端的个人档案里，不会发到飞书 / 微信聊天中。链接一次有效。</p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("t") || "";
    const purpose = new URLSearchParams(location.search).get("purpose") || "";
    const $ = (id) => document.getElementById(id);
    const show = (text, kind) => { $("msg").textContent = text; $("msg").className = "msg " + (kind || ""); };
    const errText = (data, fallback) => {
      const d = data && data.detail;
      return (d && (d.message || (typeof d === "string" ? d : ""))) || fallback;
    };
    const expired = "链接已失效，请回到聊天窗口重新获取。";
    const KINDS = { email: "邮件", message: "消息", article: "文章", note: "笔记", other: "草稿" };
    const DECISIONS = (d) => !d ? "" : d.confirmed ? "这份草稿已经确认定稿。" : "这份草稿已被拒绝。";

    async function initDraft() {
      const r = await fetch(`/api/sandbox/draft?t=${encodeURIComponent(token)}`);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return false;
      $("intro").textContent = "这是本次的完整草稿，只在网页里展示。";
      $("draftKind").textContent = KINDS[String(data.kind || "other").toLowerCase()] || KINDS.other;
      if (data.title) { $("draftTitle").textContent = data.title; $("draftTitle").hidden = false; }
      $("draftBody").textContent = data.body || "（无）";
      const notes = Array.isArray(data.notes) ? data.notes.filter(Boolean) : [];
      if (notes.length) {
        for (const n of notes) {
          const li = document.createElement("li");
          li.textContent = String(n);
          $("draftNotes").appendChild(li);
        }
        $("draftNotes").hidden = false;
      }
      const decision = DECISIONS(data.decision);
      if (decision) { $("draftDecision").textContent = decision; $("draftDecision").hidden = false; }
      $("draft").hidden = false;
      return true;
    }

    async function initSandbox() {
      const r = await fetch(`/api/channels/link?purpose=sandbox&t=${encodeURIComponent(token)}`);
      if (!r.ok) return false;
      const data = await r.json();
      $("intro").textContent = `在这里填写的隐私信息只进入你的个人档案；提交后会在${data.channel_label}里通知你（不含隐私内容）。`;
      $("form").hidden = false;
      return true;
    }

    async function init() {
      if (!token) { $("intro").textContent = expired; return; }
      if (purpose === "draft") {
        if (await initDraft()) return;
      } else if (purpose === "sandbox") {
        if (await initSandbox()) return;
      } else {
        if (await initSandbox()) return;
        if (await initDraft()) return;
      }
      $("intro").textContent = expired;
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("submit").disabled = true;
      show("正在提交…");
      try {
        const r = await fetch("/api/sandbox/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            name: $("name").value,
            city: $("city").value,
            phone: $("phone").value,
            email: $("email").value,
            facts: $("facts").value,
          }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { show(errText(data, "提交失败，请重试"), "err"); $("submit").disabled = r.status === 410; return; }
        $("form").hidden = true;
        show(`已安全保存：${(data.updated || []).join("、")}。可以回到聊天窗口继续了。`, "ok");
      } catch (e) {
        show("网络异常，请重试", "err");
        $("submit").disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
